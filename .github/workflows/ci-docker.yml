# CI/CD Pipeline - Docker 版本
# 使用 Docker 容器运行测试，环境一致、可移植
# 注意：云端容器无法访问内网数据库，只运行 CI 验证测试
# 只在 PR 时运行，push 时由 ci.yml 运行完整测试

name: Steelworks CI (Docker)

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/steelworks:latest
          ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  test:
    name: Run Tests in Docker
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Pull and run tests
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
        docker run --rm \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: allure-results/

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ Tests Failed!"
        else
          echo "✅ Tests Passed!"
        fi