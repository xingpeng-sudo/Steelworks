# CI/CD Pipeline - Docker 版本
# 使用 Docker 容器运行测试，环境一致、可移植

name: Steelworks CI (Docker)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/steelworks:latest
          ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  test:
    name: Run Tests in Docker
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Pull image
      run: docker pull ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
      
    - name: Run tests in container
      run: |
        docker run --rm \
          -e DB_HOST=${{ secrets.DB_HOST }} \
          -e DB_PORT=${{ secrets.DB_PORT }} \
          -e DB_USER=${{ secrets.DB_USER }} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -e DB_SERVICE=${{ secrets.DB_SERVICE }} \
          -v ${{ github.workspace }}/reports:/app/reports \
          ghcr.io/${{ github.repository_owner }}/steelworks:${{ github.sha }}
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: reports/

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ Tests Failed!"
        else
          echo "✅ Tests Passed!"
        fi