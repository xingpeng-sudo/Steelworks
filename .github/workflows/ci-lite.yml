# 简化版 CI - 不依赖数据库连接
# 用于代码质量检查和静态测试
# 只在 PR 时运行，push 时由 ci.yml 和 ci-docker.yml 运行

name: Steelworks CI Lite

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install lint tools
      run: pip install flake8 black isort
        
    - name: Check code format with black
      run: black --check --diff .
      continue-on-error: true
      
    - name: Check import order with isort
      run: isort --check-only --diff .
      continue-on-error: true
      
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  static-check:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas
        
    - name: Syntax check
      run: |
        python -m py_compile utils/db_helper.py && echo "✅ db_helper.py OK"
        python -m py_compile utils/sql_loader.py && echo "✅ sql_loader.py OK"
        python -m py_compile config/db_config.py && echo "✅ db_config.py OK"
        python -m py_compile conftest.py && echo "✅ conftest.py OK"
        echo "✅ 所有文件语法检查通过"
        
    - name: Check test files exist
      run: |
        ls -la tests/
        ls -la tests/test_common/
        ls -la tests/test_rtd_mts_lg1/
        echo "✅ 测试文件结构检查完成"