# CI/CD Pipeline for Steelworks Data Validation
# 触发条件: push到main分支 或 提交PR
# 功能: 代码检查、测试执行、报告生成

name: Steelworks CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========== 代码质量检查 ==========
  lint:
    name: Code Quality Check
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Python version
      run: python --version
        
    - name: Install lint tools
      run: |
        pip install flake8 black isort
        
    - name: Check code format with black
      run: |
        black --check --diff .
      continue-on-error: true
      
    - name: Check import order with isort
      run: |
        isort --check-only --diff .
      continue-on-error: true
      
    - name: Lint with flake8
      run: |
        # E501: line too long (暂时忽略)
        # W503: line break before binary operator (与black冲突)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ========== 测试执行 ==========
  test:
    name: Run Tests
    runs-on: self-hosted
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Python version
      run: python --version
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create db_config.py from secrets
      run: |
        cat > config/db_config.py << 'EOF'
        """CI环境数据库配置"""
        import os
        
        STEELWORKS_DB = {
            "user": os.getenv("DB_USER", ""),
            "password": os.getenv("DB_PASSWORD", ""),
            "dsn": os.getenv("DB_DSN", "")
        }
        
        DB_CONFIGS = {
            "test": STEELWORKS_DB,
        }
        EOF
        
    - name: Run smoke tests
      run: |
        pytest -m smoke -v --tb=short
      continue-on-error: true
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Run all tests with coverage
      run: |
        pytest --cov=utils --cov=tests --cov-report=xml --cov-report=html -v --tb=short --alluredir=reports/allure-results
      continue-on-error: true
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          reports/
          htmlcov/

  # ========== 生成Allure报告 ==========
  report:
    name: Generate Allure Report
    runs-on: self-hosted
    needs: test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: .
        
    - name: Check downloaded files
      run: |
        echo "Downloaded files:"
        ls -la
        echo "Reports directory:"
        ls -la reports/ || echo "reports/ not found"
        echo "Allure results:"
        ls -la reports/allure-results/ || echo "allure-results not found"
        
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: reports/allure-results
        allure_history: allure-history
        keep_reports: 20
        
    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

  # ========== 通知（可选） ==========
  notify:
    name: Send Notification
    runs-on: self-hosted
    needs: [lint, test]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Test: ${{ needs.test.result }}"
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ CI Pipeline Failed!"
        echo "请检查测试日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
