# CI/CD Pipeline for Steelworks Data Validation
# Self-Hosted Runner 版本 - 在 Windows 机器上运行
# 触发条件: push到main分支 或 提交PR
# 功能: 代码检查、测试执行、报告生成

name: Steelworks CI (Windows Self-Hosted)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ========== 代码质量检查 ==========
  lint:
    name: Code Quality Check
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Python version
      shell: powershell
      run: python --version
        
    - name: Install lint tools
      shell: powershell
      run: |
        pip install flake8 black isort
        
    - name: Check code format with black
      shell: powershell
      run: |
        black --check --diff .
      continue-on-error: true
      
    - name: Check import order with isort
      shell: powershell
      run: |
        isort --check-only --diff .
      continue-on-error: true
      
    - name: Lint with flake8
      shell: powershell
      run: |
        # E501: line too long (暂时忽略)
        # W503: line break before binary operator (与black冲突)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ========== 测试执行 ==========
  test:
    name: Run Tests
    runs-on: self-hosted
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Python version
      shell: powershell
      run: python --version
        
    - name: Install dependencies
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Clean and create reports directory
      shell: powershell
      run: |
        # 清理旧的 allure-results，确保每次只显示当前测试结果
        if (Test-Path reports\allure-results) { Remove-Item reports\allure-results\* -Recurse -Force }
        if (-not (Test-Path reports)) { New-Item -ItemType Directory -Force -Path reports }
        New-Item -ItemType Directory -Force -Path reports\allure-results
        
    - name: Verify Secrets are set
      shell: powershell
      run: |
        Write-Host "Checking Secrets..."
        if ($env:DB_USER) { Write-Host "DB_USER: SET" } else { Write-Host "DB_USER: NOT SET" }
        if ($env:DB_PASSWORD) { Write-Host "DB_PASSWORD: SET" } else { Write-Host "DB_PASSWORD: NOT SET" }
        if ($env:DB_DSN) { Write-Host "DB_DSN: SET ($env:DB_DSN)" } else { Write-Host "DB_DSN: NOT SET" }
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Create db_config.py from secrets
      shell: powershell
      run: |
        $user = $env:DB_USER
        $password = $env:DB_PASSWORD
        $dsn = $env:DB_DSN
        
        if (-not $user) { $user = "steelworks" }
        if (-not $password) { $password = "steelworks" }
        if (-not $dsn) { $dsn = "192.168.1.121:1521/ORCLPDB" }
        
        $lines = @(
            '# CI Database Configuration',
            'import os',
            '',
            'STEELWORKS_DB = {',
            "    `"user`": `"$user`",",
            "    `"password`": `"$password`",",
            "    `"dsn`": `"$dsn`"",
            '}',
            '',
            'DB_CONFIGS = {',
            '    "test": STEELWORKS_DB,',
            '}'
        )
        $lines | Out-File -FilePath "config\db_config.py" -Encoding ASCII
        Write-Host "db_config.py created with DSN: $dsn"
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Check database connectivity
      shell: powershell
      run: |
        Write-Host "Checking database connectivity..."
        $dsn = $env:DB_DSN
        Write-Host "DSN: $dsn"
        # 尝试解析主机和端口
        if ($dsn -match "([^:]+):(\d+)") {
            $dbHost = $matches[1]
            $dbPort = $matches[2]
            Write-Host "Host: $dbHost, Port: $dbPort"
            # 测试连接
            try {
                $tcp = New-Object System.Net.Sockets.TcpClient
                $tcp.Connect($dbHost, [int]$dbPort)
                $tcp.Close()
                Write-Host "Database is reachable"
            } catch {
                Write-Host "WARNING: Cannot connect to database: $_"
            }
        }
      continue-on-error: true
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Run all tests with coverage
      shell: powershell
      run: |
        python -m pytest --cov=utils --cov=tests --cov-report=xml --cov-report=html -v --tb=short --alluredir=reports\allure-results
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: .\coverage.xml
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          reports\
          htmlcov\

  # ========== 生成Allure报告 ==========
  report:
    name: Generate Allure Report
    runs-on: self-hosted
    needs: test
    if: always()
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: .
        
    - name: Check downloaded files
      shell: powershell
      run: |
        Write-Host "Downloaded files:"
        Get-ChildItem -Force -Recurse | Select-Object -First 20
        Write-Host "Reports directory:"
        if (Test-Path reports) { Get-ChildItem reports -Force } else { Write-Host "reports not found" }
        Write-Host "Allure results:"
        if (Test-Path reports\allure-results) { 
          Get-ChildItem reports\allure-results -Force 
          Write-Host "Count: $(@(Get-ChildItem reports\allure-results\*.json -ErrorAction SilentlyContinue).Count) JSON files"
        } else { 
          Write-Host "allure-results not found" 
        }
        
    - name: Generate Allure Report
      if: always()
      shell: powershell
      run: |
        $allureCmd = "D:\allure-2.24.1\bin\allure.bat"
        Write-Host "Using Allure: $allureCmd"
        Write-Host "Allure exists: $(Test-Path $allureCmd)"
        
        # Check if allure-results exists and has content
        if ((Test-Path reports\allure-results) -and (Get-ChildItem reports\allure-results\*.json -ErrorAction SilentlyContinue)) {
          Write-Host "Found allure-results with JSON files, generating report..."
          
          # Create allure-history directory
          New-Item -ItemType Directory -Force -Path allure-history
          
          # Check for existing history
          if (Test-Path allure-history\history) {
            Write-Host "Found existing history, copying to allure-results..."
            Copy-Item allure-history\history reports\allure-results\ -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          # Generate report with history
          & $allureCmd generate reports\allure-results -o allure-report --clean
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Allure report generated successfully"
            # Copy new report to allure-history
            Copy-Item allure-report\* allure-history\ -Recurse -Force
            Write-Host "Report copied to allure-history"
          } else {
            Write-Host "Allure generate failed with code $LASTEXITCODE"
            # Create a simple error page
            '<html><body><h1>Report Generation Failed</h1></body></html>' | Out-File -FilePath allure-history\index.html
          }
        } else {
          Write-Host "No allure-results found or empty, creating placeholder"
          New-Item -ItemType Directory -Force -Path allure-history
          '<html><body><h1>No Test Results</h1></body></html>' | Out-File -FilePath allure-history\index.html
        }
        
        # List final directory
        Write-Host "Final allure-history contents:"
        Get-ChildItem allure-history -Force -Recurse | Select-Object -First 30
        
    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        
    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-history\

  # ========== 通知（可选） ==========
  notify:
    name: Send Notification
    runs-on: self-hosted
    needs: [lint, test]
    if: always()
    
    steps:
    - name: Check test results
      shell: powershell
      run: |
        Write-Host "Lint: ${{ needs.lint.result }}"
        Write-Host "Test: ${{ needs.test.result }}"
        
    - name: Notify on failure
      if: failure()
      run: |
        Write-Host "❌ CI Pipeline Failed!"
        Write-Host "请检查测试日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
